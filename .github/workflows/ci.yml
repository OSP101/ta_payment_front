name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json have drifted apart.
      - name: Install
        run: npm ci

      # The vendored heroui-react skill is loaded by coding agents as trusted
      # guidance. skills-lock.json's computedHash cannot guard it: the fetch
      # tool writes that hash itself, npm install rewrites it (differently per
      # OS), and it has never matched the committed file. This checks the
      # files that are actually committed and loaded against our own pin, and
      # it BLOCKS — run after `npm ci` so a rewrite by the install is caught
      # too. Updating the skill on purpose: replace the files, then regenerate
      # the pin (command in AGENTS.md) in the same commit.
      - name: Verify vendored skill content
        run: sha256sum -c --strict .agents/skills/heroui-react.sha256

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dependency audit (blocking high and critical)
        run: npm audit --audit-level=high

      - name: Request body and client IP regressions
        run: node --test scripts/request-body.test.mjs scripts/client-ip.test.mjs

      - name: API telemetry privacy regressions
        run: node --test scripts/api-telemetry.test.mjs

      - name: Build
        run: npm run build

      # npm install rewrites the HeroUI block in CLAUDE.md and the hash in
      # skills-lock.json, and does so differently on Windows and macOS. Report
      # the drift without failing the build — it is tooling churn, not a defect,
      # but a silent rewrite is worth seeing in the log.
      - name: Report generated-file drift
        if: always()
        run: git diff --stat -- CLAUDE.md skills-lock.json || true
